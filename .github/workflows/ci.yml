name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check pg-migrate.mjs
      - run: node pg-migrate.mjs --help
      - run: node pg-migrate.mjs --version

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17]
    services:
      source:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: src }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      target:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: tgt }
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL ${{ matrix.pg }} client tools
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-${{ matrix.pg }}
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"
      - run: bash test/e2e.sh
        env:
          SOURCE_URL: postgres://postgres:pw@localhost:5432/src
          TARGET_URL: postgres://postgres:pw@localhost:5433/tgt
